version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      react-native:
        patterns:
          - "react-native"
          - "@react-native/*"
      types:
        patterns:
          - "@types/*"
      testing:
        patterns:
          - "@testing-library/*"
          - "jest"
          - "babel-jest"
          - "ts-jest"

  - package-ecosystem: "npm"
    directory: "/example"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      react-native:
        patterns:
          - "react-native"
          - "@react-native/*"
      types:
        patterns:
          - "@types/*"
      testing:
        patterns:
          - "@testing-library/*"
          - "jest"
          - "babel-jest"
          - "ts-jest"

  - package-ecosystem: "gradle"
    directory: "/example/android"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
