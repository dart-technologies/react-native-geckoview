name: "Setup environment"
description: "Install Node, Java, and the library + example dependencies."

inputs:
  java:
    description: "Whether to install JDK (for Android jobs)"
    required: false
    default: "false"
  gradle:
    description: "Whether to set up Gradle caching (for Android jobs)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"

    - name: Enable the pinned package manager
      shell: bash
      run: corepack enable && corepack prepare yarn@4.10.3 --activate

    - name: Cache Yarn packages
      uses: actions/cache@v4
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', 'example/yarn.lock') }}

    - name: Install root dependencies
      shell: bash
      run: yarn install --immutable

    - name: Install example dependencies
      shell: bash
      working-directory: example
      run: yarn install --immutable

    - name: Set up JDK 21
      if: inputs.java == 'true'
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: "21"

    - name: Set up Gradle
      if: inputs.gradle == 'true'
      uses: gradle/actions/setup-gradle@v4

    - name: Cache Android SDK
      if: inputs.gradle == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.android/build-cache
          ~/.gradle/caches/build-cache-1
        key: android-sdk-${{ runner.os }}-${{ hashFiles('example/android/build.gradle', 'android/build.gradle') }}
        restore-keys: |
          android-sdk-${{ runner.os }}-

    # ubuntu-26.04 runner images no longer put sdkmanager on PATH; this installs
    # the command-line tools and adds them. Its default package list asks for the
    # legacy `tools` package, which the SDK repository no longer serves, so name
    # platform-tools; the step below installs what GeckoView needs.
    - name: Set up the Android SDK command-line tools
      if: inputs.gradle == 'true'
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    - name: Install the Android platform required by GeckoView
      if: inputs.gradle == 'true'
      shell: bash
      run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;27.1.12297006'
