// android/build.gradle
//
// react-native-geckoview — Android library module.
//
// Aligned to React Native 0.88 (New Architecture only). Paper / Legacy
// Architecture is no longer supported: SDK 55 / RN 0.83 removed the legacy
// renderer and the RN Gradle Plugin no longer honors `newArchEnabled`.

def DEFAULT_COMPILE_SDK_VERSION = 37
def DEFAULT_BUILD_TOOLS_VERSION = '37.0.0'
def DEFAULT_MIN_SDK_VERSION = 26
def DEFAULT_TARGET_SDK_VERSION = 36

// https://maven.mozilla.org/?prefix=maven2/org/mozilla/geckoview/geckoview/
// Version history (for reference):
//   97.0.20220304162637  - previous stable pin
//   143.0.20250908174027 - upgraded 2025-12-02
//   150.0.20260415192539 - upgraded 2026-04-22
//   159.0.20261022150525 - SDK 58 / Android 37.2 baseline
// See: https://mozilla.github.io/geckoview/javadoc/mozilla-central/org/mozilla/geckoview/doc-files/CHANGELOG
def nativeVersions = new groovy.json.JsonSlurper().parse(file('versions.json'))
def DEFAULT_GECKOVIEW_VERSION = nativeVersions.geckoview

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            def standaloneVersions = new groovy.json.JsonSlurper().parse(project.file('versions.json'))
            classpath 'com.android.tools.build:gradle:9.2.1'
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${standaloneVersions.kotlin}"
            classpath 'com.facebook.react:react-native-gradle-plugin'
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'kotlin-android'
// Report-only code coverage. Applying the `jacoco` plugin makes AGP's
// `test<Variant>UnitTest` tasks emit a `.exec` file; the `jacocoTestReport`
// task below turns that into HTML/XML. Intentionally NO coverage *verification*
// rule — this is measurement only and never fails the build or CI.
apply plugin: 'jacoco'

// Codegen always runs — New Architecture is the only supported mode.
apply plugin: 'com.facebook.react'

jacoco {
    // 0.8.12+ is required for JDK 21 / Gradle 9 class-file support.
    toolVersion = '0.8.12'
}

android {
    namespace 'com.reactnative.geckoview'
    compileSdkVersion "android-${nativeVersions.compileSdk}.${nativeVersions.compileSdkMinor}"
    buildToolsVersion safeExtGet('buildToolsVersion', DEFAULT_BUILD_TOOLS_VERSION)
    // AGP 8+: BuildConfig generation must be opted into. Required so Kotlin
    // can gate debug-only runtime flags (sandbox relaxation, console output,
    // verbose logging) on `BuildConfig.DEBUG`.
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', DEFAULT_MIN_SDK_VERSION)
        targetSdkVersion safeExtGet('targetSdkVersion', DEFAULT_TARGET_SDK_VERSION)
    }
    lint {
        // Warnings only — the library has known lint noise from GeckoView's
        // reflective API usage and from React Native's codegen output that
        // we don't control. CI still uploads the lint HTML report.
        abortOnError false
        warningsAsErrors false
        checkReleaseBuilds false
    }
    testOptions {
        unitTests.all {
            // Robolectric loads classes through its own instrumenting
            // classloader, which have no source-location in the JaCoCo agent's
            // view. Without this flag the on-the-fly agent records zero
            // coverage. (Report-only — see the jacocoTestReport task.)
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
    }
    sourceSets {
        main {
            java.srcDirs = [
                'src/main/kotlin',
                'src/newarch/kotlin',
                "$buildDir/generated/source/codegen/java"
            ]
        }
    }
}

androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        variantBuilder.enableUnitTest = true
    }
}

react {
    libraryName = "reactnativegeckoview"
    root = project.file("../example/")
    jsRootDir = file("../src")
    codegenJavaPackageName = "com.reactnative.geckoview"
}

afterEvaluate {
    tasks.matching { task ->
        task.name.startsWith("configureCMake") || task.name.startsWith("buildCMake")
    }.configureEach { task ->
        task.dependsOn("generateCodegenArtifactsFromSchema")
    }
    tasks.matching { task ->
        task.name.startsWith("compile") &&
            (task.name.contains("Kotlin") || task.name.contains("JavaWithJavac"))
    }.configureEach { task ->
        task.dependsOn("generateCodegenArtifactsFromSchema")
    }
}

tasks.withType(Javadoc).all {
    enabled = false
}

repositories {
    mavenLocal()
    maven {
        url "$rootDir/../node_modules/react-native/android"
    }
    maven {
        url "$rootDir/../node_modules/jsc-android/dist"
    }
    maven {
        url "https://maven.mozilla.org/maven2/"
    }
    google()
    mavenCentral()
}

dependencies {
    def geckoviewVersion = safeExtGet('geckoviewVersion', DEFAULT_GECKOVIEW_VERSION)
    // The host React Native Gradle plugin supplies the exact installed version.
    // Never independently resolve another renderer via a dynamic Maven range.
    implementation 'com.facebook.react:react-android'
    implementation "org.mozilla.geckoview:geckoview:${geckoviewVersion}"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.13.13'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

def configureReactNativePom(def pom) {
    def packageJson = new groovy.json.JsonSlurper().parseText(file('../package.json').text)

    pom.project {
        name packageJson.title
        artifactId packageJson.name
        version = packageJson.version
        group = "com.reactnative.geckoview"
        description packageJson.description
        url packageJson.repository.baseUrl

        licenses {
            license {
                name packageJson.license
                url packageJson.repository.baseUrl + '/blob/master/' + packageJson.licenseFilename
                distribution 'repo'
            }
        }

        developers {
            developer {
                id packageJson.author.username
                name packageJson.author.name
            }
        }
    }
}

afterEvaluate { project ->
    task androidSourcesJar(type: Jar) {
        archiveClassifier = 'sources'
        from android.sourceSets.main.java.srcDirs
        include '**/*.kt', '**/*.java'
    }

    artifacts {
        archives androidSourcesJar
    }
}

// ---------------------------------------------------------------------------
// Report-only JaCoCo coverage for the debug unit-test variant.
//
// Measurement only: there is deliberately no `jacocoTestCoverageVerification`
// task and no `violationRules` — coverage is never gated and CI never fails on
// a coverage threshold. Run with:
//
//   ./gradlew :react-native-geckoview:jacocoTestReport
//
// (it depends on testDebugUnitTest, so the exec data is produced first).
// ---------------------------------------------------------------------------
tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    group = 'verification'
    description = 'Generates a report-only JaCoCo coverage report for the debug unit tests.'

    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }

    // Exclude generated/framework noise so the percentage reflects hand-written
    // Kotlin only: codegen view-manager glue, BuildConfig, and R classes.
    def excludes = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/*Manifest*.*',
        '**/com/facebook/react/viewmanagers/**',
    ]

    def kotlinDebugClasses = fileTree(dir: "$buildDir/tmp/kotlin-classes/debug", excludes: excludes)
    def javacDebugClasses = fileTree(dir: "$buildDir/intermediates/javac/debug", excludes: excludes)
    classDirectories.setFrom(files([kotlinDebugClasses, javacDebugClasses]))

    sourceDirectories.setFrom(files(['src/main/kotlin', 'src/newarch/kotlin']))
    executionData.setFrom(fileTree(dir: buildDir, includes: ['jacoco/testDebugUnitTest.exec']))
}
